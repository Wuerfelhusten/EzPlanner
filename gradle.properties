org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# In-app updater: GitHub repository (owner/name) whose latest release APK EzPlanner offers as update.
# Empty = updater off.
ezplanner.updateRepo=Wuerfelhusten/EzPlanner

# App version (MAJOR.MINOR.PATCH). A release is published by pushing the tag v<this version>;
# the release workflow fails if tag and version differ. versionCode is derived from it.
ezplanner.versionName=2.3.0
